<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>함현고 제주 수학여행 자료실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --sea: #0e6e8c;
    --sea-deep: #0a4f66;
    --sand: #f6f1e7;
    --tangerine: #f08a24;
    --ink: #1f2a30;
    --muted: #61707a;
    --card: #ffffff;
    --line: #e4ddd0;
    --danger: #c0392b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Noto Sans KR", system-ui, sans-serif;
    color: var(--ink);
    background: var(--sand);
  }
  header {
    background: linear-gradient(160deg, var(--sea) 0%, var(--sea-deep) 100%);
    color: #fff;
    padding: 40px 20px 56px;
    position: relative;
    overflow: hidden;
  }
  header::after {
    content: "";
    position: absolute;
    left: -5%; right: -5%; bottom: -30px;
    height: 60px;
    background: var(--sand);
    border-radius: 50% 50% 0 0 / 100% 100% 0 0;
  }
  .wrap { max-width: 1200px; margin: 0 auto; }
  .eyebrow {
    display: inline-block;
    font-size: 13px;
    letter-spacing: .08em;
    background: var(--tangerine);
    padding: 4px 10px;
    border-radius: 999px;
    font-weight: 700;
  }
  h1 {
    font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
    font-size: clamp(28px, 5vw, 44px);
    margin: 14px 0 6px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  header p { margin: 0; opacity: .85; }

  main { padding: 8px 16px 48px; }
  .layout {
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 20px;
    align-items: start;
  }
  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px;
  }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .panel h2 { font-size: 18px; margin: 0; }
  .count { color: var(--muted); font-size: 14px; margin-left: 6px; font-weight: 400; }
  .refresh {
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 8px;
    padding: 4px 10px;
    font: inherit;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
  }
  .refresh:hover { color: var(--sea); border-color: var(--sea); }

  .drop {
    display: block;
    margin: 14px 0 16px;
    border: 2px dashed #b9cfd6;
    border-radius: 14px;
    background: #f3f9fb;
    padding: 22px 14px;
    text-align: center;
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .drop:hover, .drop.over { background: #e3f2f6; border-color: var(--sea); }
  .drop.busy { opacity: .6; pointer-events: none; }
  .drop strong { display: block; color: var(--sea-deep); font-size: 16px; }
  .drop span { display: block; margin-top: 4px; font-size: 13px; color: var(--muted); }
  .drop input { display: none; }
  .status { min-height: 20px; font-size: 13px; color: var(--sea-deep); margin: -6px 0 10px; }
  .status.err { color: var(--danger); }

  ol.files { list-style: none; margin: 0; padding: 0; }
  ol.files li { display: flex; gap: 6px; align-items: stretch; }
  ol.files li + li { margin-top: 8px; }
  .file {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    text-align: left;
    background: #fbf9f4;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px;
    font: inherit;
    color: inherit;
    cursor: pointer;
  }
  .file:hover { border-color: var(--sea); }
  .file.active { background: #e6f3f7; border-color: var(--sea); }
  .num {
    flex: none;
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--sea);
    color: #fff;
    display: grid;
    place-items: center;
    font-size: 14px;
    font-weight: 700;
  }
  .meta { min-width: 0; }
  .fname { display: block; font-weight: 500; word-break: break-all; }
  .fdate { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .del {
    flex: none;
    width: 40px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #fff;
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
  }
  .del:hover { color: var(--danger); border-color: var(--danger); }
  .empty {
    padding: 40px 16px;
    text-align: center;
    color: var(--muted);
    line-height: 1.7;
  }

  .viewer { padding: 0; overflow: hidden; }
  .viewer-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
  }
  .viewer-title { font-weight: 700; word-break: break-all; }
  .open-link {
    color: var(--sea);
    font-size: 14px;
    font-weight: 700;
    text-decoration: none;
    white-space: nowrap;
  }
  .viewer-actions { display: flex; align-items: center; gap: 12px; flex: none; }
  .close-btn {
    display: none;
    border: 0;
    background: var(--sea);
    color: #fff;
    font: inherit;
    font-weight: 700;
    font-size: 14px;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
  }
  #vbody.pages {
    height: 78vh;
    overflow-y: auto;
    background: #e9e6df;
    padding: 12px;
    -webkit-overflow-scrolling: touch;
  }
  .page {
    position: relative;
    width: 100%;
    background: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.15);
    aspect-ratio: 1 / 1.414;
  }
  .page + .page { margin-top: 12px; }
  .page canvas { display: block; width: 100%; height: auto; }
  .page.waiting::before {
    content: "페이지 그리는 중…";
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: var(--muted);
    font-size: 14px;
  }
  .progress {
    width: min(260px, 80%);
    height: 8px;
    margin: 14px auto 0;
    background: #ddd6c8;
    border-radius: 999px;
    overflow: hidden;
  }
  .progress > i {
    display: block;
    height: 100%;
    width: 0;
    background: var(--sea);
    transition: width .2s;
  }
  .page-no {
    position: absolute;
    right: 8px; bottom: 8px;
    font-size: 12px;
    background: rgba(0,0,0,.55);
    color: #fff;
    padding: 2px 8px;
    border-radius: 999px;
  }
  .loading { padding: 60px 16px; text-align: center; color: var(--muted); }

  .modal-bg {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(15, 30, 38, .45);
    display: grid;
    place-items: center;
    padding: 16px;
  }
  .modal-bg[hidden] { display: none; }
  .modal {
    width: min(360px, 100%);
    background: #fff;
    border-radius: 16px;
    padding: 22px 20px 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,.2);
  }
  .modal h3 { margin: 0 0 6px; font-size: 18px; }
  .modal p { margin: 0 0 14px; font-size: 14px; color: var(--muted); word-break: break-all; }
  .modal input {
    width: 100%;
    font: inherit;
    font-size: 16px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .modal input:focus { outline: 2px solid var(--sea); border-color: transparent; }
  .modal .err { min-height: 20px; margin: 6px 0 0; font-size: 13px; color: var(--danger); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
  .modal-actions button {
    font: inherit;
    font-weight: 700;
    font-size: 14px;
    padding: 9px 16px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: #fff;
    cursor: pointer;
  }
  .modal-actions .danger { background: var(--danger); border-color: var(--danger); color: #fff; }

  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    .viewer { display: none; }
    .viewer.open {
      display: flex;
      flex-direction: column;
      position: fixed;
      inset: 0;
      z-index: 50;
      border-radius: 0;
      border: 0;
    }
    .viewer.open #vbody.pages { flex: 1; height: auto; padding: 8px; }
    .viewer.open .close-btn { display: inline-block; }
    body.viewing { overflow: hidden; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <span class="eyebrow">함현고 수학여행</span>
    <h1>함현고 제주 수학여행 자료실</h1>
    <p>일정표, 안내문, 활동지 등 수학여행 자료를 올리고 함께 볼 수 있어요.</p>
  </div>
</header>

<main>
  <div class="wrap layout">
    <section class="panel">
      <div class="panel-head">
        <h2>자료 목록<span class="count" id="count"></span></h2>
        <button class="refresh" id="refresh" type="button">↻ 새로고침</button>
      </div>

      <label class="drop" id="drop">
        <input type="file" id="picker" accept="application/pdf,.pdf" multiple>
        <strong>＋ PDF 자료 올리기</strong>
        <span>여기를 누르거나 파일을 끌어다 놓으세요 (여러 개 가능)</span>
      </label>
      <div class="status" id="status"></div>

      <ol class="files" id="list"></ol>
    </section>

    <section class="panel viewer" id="viewer">
      <div class="viewer-bar">
        <span class="viewer-title" id="vtitle">자료를 선택하세요</span>
        <span class="viewer-actions">
          <a class="open-link" id="vopen" target="_blank" rel="noopener" hidden>원본 파일 ↗</a>
          <button class="close-btn" id="vclose" type="button">닫기</button>
        </span>
      </div>
      <div id="vbody" class="empty">왼쪽 목록에서 자료를 누르면<br>여기에서 바로 볼 수 있어요.</div>
    </section>
  </div>
</main>

<div class="modal-bg" id="delModal" hidden>
  <form class="modal" id="delForm">
    <h3>자료 삭제</h3>
    <p id="delName"></p>
    <input type="password" id="delPw" inputmode="numeric" autocomplete="off" placeholder="삭제 비밀번호">
    <div class="err" id="delErr"></div>
    <div class="modal-actions">
      <button type="button" id="delCancel">취소</button>
      <button type="submit" class="danger">삭제</button>
    </div>
  </form>
</div>

<script>
  /* ============================================================
     ▼ Supabase 설정 — 이 두 줄만 본인 값으로 바꿔 주세요
     ============================================================ */
  const SUPABASE_URL = "https://waslzzheyllzjtdisnlt.supabase.co";
  const SUPABASE_KEY = "sb_publishable_6Vaoz6fefDW9cvdeiNkCUA_4CyglM-O";
  const BUCKET = "trip";
  // 삭제 비밀번호(1234)를 암호화한 값 — 비밀번호를 바꾸려면 새 값으로 교체
  const DELETE_PW_HASH = "03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4";
  /* ============================================================ */

  const list = document.getElementById("list");
  const countEl = document.getElementById("count");
  const statusEl = document.getElementById("status");
  const drop = document.getElementById("drop");
  const picker = document.getElementById("picker");
  const vtitle = document.getElementById("vtitle");
  const vopen = document.getElementById("vopen");
  const vbody = document.getElementById("vbody");

  let activeKey = null;
  let store = null;

  // 입력값 정리: 앞뒤 공백 제거, https:// 자동 추가, 끝의 / 나 경로 제거
  let projectUrl = SUPABASE_URL.trim();
  // 프로젝트 ID만 넣은 경우(예: abcdxyz) 자동으로 주소 완성
  if (/^[a-z0-9]{10,40}$/i.test(projectUrl)) projectUrl = projectUrl + ".supabase.co";
  if (projectUrl && !projectUrl.startsWith("여기에") && !/^https?:\/\//i.test(projectUrl)) {
    projectUrl = "https://" + projectUrl;
  }
  projectUrl = projectUrl.replace(/(\.supabase\.co).*$/i, "$1").replace(/\/+$/, "");
  const projectKey = SUPABASE_KEY.trim();

  let setupProblem = "";
  if (!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(projectUrl)) {
    setupProblem = "SUPABASE_URL 값이 올바르지 않아요.<br>https://프로젝트ID.supabase.co 형태로 넣어 주세요.";
  } else if (!projectKey || projectKey.startsWith("여기에")) {
    setupProblem = "SUPABASE_KEY 값이 비어 있어요.<br>Publishable key를 붙여 넣어 주세요.";
  } else if (!window.supabase) {
    setupProblem = "Supabase 프로그램을 불러오지 못했어요.<br>인터넷 연결을 확인하거나, 학교망이라면 다른 네트워크에서 열어 보세요.";
  } else {
    try {
      store = window.supabase.createClient(projectUrl, projectKey).storage.from(BUCKET);
    } catch (e) {
      setupProblem = "Supabase 연결 중 오류가 났어요: " + e.message;
    }
  }

  /* 한글 파일 이름을 안전하게 저장하기 위한 변환
     저장 이름 형식: 업로드시각_인코딩된원래이름.pdf  → 시각 순으로 정렬됨 */
  function encodeName(name) {
    const bytes = new TextEncoder().encode(name);
    let bin = "";
    bytes.forEach((b) => (bin += String.fromCharCode(b)));
    return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function decodeName(enc) {
    try {
      let s = enc.replace(/-/g, "+").replace(/_/g, "/");
      while (s.length % 4) s += "=";
      const bin = atob(s);
      return new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0)));
    } catch (e) { return enc; }
  }
  function parseKey(key) {
    const m = key.match(/^(\d+)_(.+)\.pdf$/i);
    if (!m) return { time: 0, name: key.replace(/\.pdf$/i, "") };
    return { time: Number(m[1]), name: decodeName(m[2]).replace(/\.pdf$/i, "") };
  }

  const fmtDate = (t) => new Date(t).toLocaleString("ko-KR", {
    month: "long", day: "numeric", hour: "2-digit", minute: "2-digit"
  });

  function setStatus(msg, isErr) {
    statusEl.textContent = msg || "";
    statusEl.classList.toggle("err", !!isErr);
  }

  function resetViewer() {
    stopRender();
    activeKey = null;
    vtitle.textContent = "자료를 선택하세요";
    vopen.hidden = true;
    vbody.className = "empty";
    vbody.innerHTML = "왼쪽 목록에서 자료를 누르면<br>여기에서 바로 볼 수 있어요.";
  }

  /* ---------- PDF 미리보기 (PC·휴대폰 모두 페이지 안에서 표시) ---------- */
  const viewerEl = document.getElementById("viewer");
  const vclose = document.getElementById("vclose");
  const PDFJS = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/legacy/build/";
  let pdfjsLib = null;
  let currentDoc = null;
  let observer = null;
  let renderToken = 0;

  const isMobile = () => window.matchMedia("(max-width: 760px)").matches;

  async function loadPdfJs() {
    if (pdfjsLib) return pdfjsLib;
    const lib = await import(PDFJS + "pdf.min.mjs");
    lib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.mjs";
    pdfjsLib = lib;
    return lib;
  }

  function stopRender() {
    renderToken++;
    if (observer) { observer.disconnect(); observer = null; }
    if (currentDoc) { currentDoc.destroy(); currentDoc = null; }
  }

  function openMobileViewer() {
    if (!isMobile() || viewerEl.classList.contains("open")) return;
    viewerEl.classList.add("open");
    document.body.classList.add("viewing");
    try { history.pushState({ viewer: true }, ""); } catch (e) {}
  }
  function closeMobileViewer(fromHistory) {
    if (!viewerEl.classList.contains("open")) return;
    viewerEl.classList.remove("open");
    document.body.classList.remove("viewing");
    stopRender();
    vbody.innerHTML = "";
    if (!fromHistory) { try { history.back(); } catch (e) {} }
  }
  vclose.addEventListener("click", () => closeMobileViewer(false));
  window.addEventListener("popstate", () => closeMobileViewer(true)); // 휴대폰 뒤로가기 = 닫기

  async function renderPage(doc, num, holder, token) {
    const page = await doc.getPage(num);
    if (token !== renderToken) return;
    const base = page.getViewport({ scale: 1 });
    holder.style.aspectRatio = `${base.width} / ${base.height}`;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const scale = (holder.clientWidth / base.width) * dpr;
    const viewport = page.getViewport({ scale });
    const canvas = document.createElement("canvas");
    canvas.width = Math.floor(viewport.width);
    canvas.height = Math.floor(viewport.height);
    await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
    if (token !== renderToken) return;
    holder.classList.remove("waiting");
    holder.prepend(canvas);
  }

  async function renderPdf(url) {
    stopRender();
    const token = renderToken;
    vbody.className = "pages";
    vbody.innerHTML = '<div class="loading"><span id="ptext">자료를 불러오는 중…</span><div class="progress"><i id="pbar"></i></div></div>';
    vbody.scrollTop = 0;
    try {
      const lib = await loadPdfJs();
      const task = lib.getDocument({
        url,
        isEvalSupported: false,
        cMapUrl: PDFJS.replace("legacy/build/", "cmaps/"),
        cMapPacked: true,
        standardFontDataUrl: PDFJS.replace("legacy/build/", "standard_fonts/")
      });
      task.onProgress = ({ loaded, total }) => {
        if (token !== renderToken) return;
        const bar = document.getElementById("pbar");
        const txt = document.getElementById("ptext");
        if (!bar || !txt) return;
        const mb = (n) => (n / 1048576).toFixed(1);
        if (total) {
          const pct = Math.min(100, Math.round((loaded / total) * 100));
          bar.style.width = pct + "%";
          txt.textContent = `자료를 불러오는 중… ${pct}% (${mb(loaded)} / ${mb(total)}MB)`;
        } else {
          txt.textContent = `자료를 불러오는 중… ${mb(loaded)}MB`;
        }
      };
      const doc = await task.promise;
      if (token !== renderToken) { doc.destroy(); return; }
      currentDoc = doc;
      vbody.innerHTML = "";

      // 페이지 자리를 먼저 만들고, 화면 가까이 오는 페이지부터 그림
      observer = new IntersectionObserver((entries) => {
        entries.forEach((en) => {
          if (!en.isIntersecting) return;
          const holder = en.target;
          observer.unobserve(holder);
          renderPage(doc, Number(holder.dataset.page), holder, token).catch(() => {});
        });
      }, { root: vbody, rootMargin: "600px 0px" });

      for (let i = 1; i <= doc.numPages; i++) {
        const holder = document.createElement("div");
        holder.className = "page waiting";
        holder.dataset.page = i;
        holder.innerHTML = `<span class="page-no">${i} / ${doc.numPages}</span>`;
        vbody.appendChild(holder);
        observer.observe(holder);
      }
    } catch (e) {
      if (token !== renderToken) return;
      vbody.className = "empty";
      vbody.innerHTML = "미리보기를 불러오지 못했어요.<br>위의 ‘원본 파일’을 눌러 열어 보세요.";
    }
  }

  function show(file, btn) {
    const url = store.getPublicUrl(file.key).data.publicUrl;
    activeKey = file.key;
    document.querySelectorAll(".file.active").forEach((el) => el.classList.remove("active"));
    btn.classList.add("active");
    vtitle.textContent = file.name;
    vopen.href = url;
    vopen.hidden = false;
    openMobileViewer();
    renderPdf(url);
  }

  /* ---------- 비밀번호 확인 후 삭제 ---------- */
  const delModal = document.getElementById("delModal");
  const delForm = document.getElementById("delForm");
  const delName = document.getElementById("delName");
  const delPw = document.getElementById("delPw");
  const delErr = document.getElementById("delErr");
  let pendingDelete = null;

  async function sha256(text) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
  }

  function askDelete(file) {
    pendingDelete = file;
    delName.textContent = `'${file.name}' 자료를 삭제하려면 비밀번호를 입력하세요. 삭제하면 모든 사람의 화면에서 사라져요.`;
    delPw.value = "";
    delErr.textContent = "";
    delModal.hidden = false;
    setTimeout(() => delPw.focus(), 50);
  }
  function closeDelete() {
    delModal.hidden = true;
    pendingDelete = null;
  }
  document.getElementById("delCancel").addEventListener("click", closeDelete);
  delModal.addEventListener("click", (e) => { if (e.target === delModal) closeDelete(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !delModal.hidden) closeDelete(); });

  delForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = pendingDelete;
    if (!f) return;
    if ((await sha256(delPw.value.trim())) !== DELETE_PW_HASH) {
      delErr.textContent = "비밀번호가 맞지 않아요.";
      delPw.select();
      return;
    }
    const { error } = await store.remove([f.key]);
    if (error) { delErr.textContent = "삭제하지 못했어요: " + error.message; return; }
    closeDelete();
    if (f.key === activeKey) resetViewer();
    setStatus("삭제했어요.");
    render();
  });

  async function render() {
    if (!store) {
      list.innerHTML = '<li class="empty">아직 저장 공간이 연결되지 않았어요.<br>' + setupProblem + '</li>';
      drop.classList.add("busy");
      return;
    }

    const { data, error } = await store.list("", {
      limit: 1000,
      sortBy: { column: "name", order: "asc" }
    });
    if (error) {
      setStatus("목록을 불러오지 못했어요: " + error.message, true);
      return;
    }

    const files = data
      .filter((o) => /\.pdf$/i.test(o.name))
      .map((o) => ({ key: o.name, ...parseKey(o.name) }))
      .sort((a, b) => a.time - b.time); // 올린 순서대로

    countEl.textContent = files.length ? `${files.length}개` : "";
    list.innerHTML = "";

    if (!files.length) {
      list.innerHTML = '<li class="empty">아직 올라온 자료가 없어요.<br>위에서 PDF를 올려 보세요.</li>';
      return;
    }

    files.forEach((f, i) => {
      const li = document.createElement("li");

      const btn = document.createElement("button");
      btn.className = "file" + (f.key === activeKey ? " active" : "");
      btn.innerHTML = `<span class="num">${i + 1}</span>
        <span class="meta"><span class="fname"></span><span class="fdate"></span></span>`;
      btn.querySelector(".fname").textContent = f.name;
      btn.querySelector(".fdate").textContent = f.time ? fmtDate(f.time) + " 업로드" : "";
      btn.addEventListener("click", () => show(f, btn));

      const del = document.createElement("button");
      del.className = "del";
      del.title = "삭제";
      del.setAttribute("aria-label", f.name + " 삭제");
      del.textContent = "×";
      del.addEventListener("click", () => askDelete(f));

      li.append(btn, del);
      list.appendChild(li);
    });
  }

  async function handleFiles(fileList) {
    if (!store) return;
    const all = Array.from(fileList);
    const pdfs = all.filter((f) => f.type === "application/pdf" || /\.pdf$/i.test(f.name));
    const skipped = all.length - pdfs.length;
    if (!pdfs.length) { setStatus("PDF 파일만 올릴 수 있어요.", true); return; }

    drop.classList.add("busy");
    let ok = 0;
    const fails = [];
    for (let i = 0; i < pdfs.length; i++) {
      const f = pdfs[i];
      setStatus(`올리는 중… (${i + 1}/${pdfs.length}) ${f.name}`);
      const key = `${Date.now()}_${encodeName(f.name.replace(/\.pdf$/i, ""))}.pdf`;
      const { error } = await store.upload(key, f, { contentType: "application/pdf", upsert: false });
      if (error) fails.push(`${f.name} (${error.message})`);
      else ok++;
      await new Promise((r) => setTimeout(r, 5)); // 시각이 겹치지 않도록
    }
    drop.classList.remove("busy");
    await render();

    let msg = `${ok}개 자료를 올렸어요.`;
    if (skipped) msg += ` PDF가 아닌 파일 ${skipped}개는 제외했어요.`;
    if (fails.length) msg += ` 실패: ${fails.join(", ")}`;
    setStatus(msg, fails.length > 0);
  }

  picker.addEventListener("change", () => { handleFiles(picker.files); picker.value = ""; });
  ["dragenter", "dragover"].forEach((ev) =>
    drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); })
  );
  ["dragleave", "drop"].forEach((ev) =>
    drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); })
  );
  drop.addEventListener("drop", (e) => handleFiles(e.dataTransfer.files));
  document.getElementById("refresh").addEventListener("click", () => { setStatus(""); render(); });

  // 다른 사람이 올린 자료도 자동으로 반영 (30초마다, 창으로 돌아올 때)
  setInterval(render, 30000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });

  render();
</script>
</body>
</html>
