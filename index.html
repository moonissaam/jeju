<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제주 수학여행 자료실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sea: #0e6e8c;
    --sea-deep: #0a4f66;
    --sand: #f6f1e7;
    --tangerine: #f08a24;
    --ink: #1f2a30;
    --muted: #61707a;
    --card: #ffffff;
    --line: #e4ddd0;
    --danger: #c0392b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Noto Sans KR", system-ui, sans-serif;
    color: var(--ink);
    background: var(--sand);
  }
  header {
    background: linear-gradient(160deg, var(--sea) 0%, var(--sea-deep) 100%);
    color: #fff;
    padding: 40px 20px 56px;
    position: relative;
    overflow: hidden;
  }
  header::after {
    content: "";
    position: absolute;
    left: -5%; right: -5%; bottom: -30px;
    height: 60px;
    background: var(--sand);
    border-radius: 50% 50% 0 0 / 100% 100% 0 0;
  }
  .wrap { max-width: 1200px; margin: 0 auto; }
  .eyebrow {
    display: inline-block;
    font-size: 13px;
    letter-spacing: .08em;
    background: var(--tangerine);
    padding: 4px 10px;
    border-radius: 999px;
    font-weight: 700;
  }
  h1 {
    font-family: "Gowun Dodum", sans-serif;
    font-size: clamp(30px, 5vw, 46px);
    margin: 14px 0 6px;
    font-weight: 400;
  }
  header p { margin: 0; opacity: .85; }

  main { padding: 8px 16px 48px; }
  .layout {
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 20px;
    align-items: start;
  }
  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px;
  }
  .panel h2 { font-size: 18px; margin: 0; }
  .count { color: var(--muted); font-size: 14px; margin-left: 6px; }

  /* 업로드 영역 */
  .drop {
    display: block;
    margin: 14px 0 16px;
    border: 2px dashed #b9cfd6;
    border-radius: 14px;
    background: #f3f9fb;
    padding: 22px 14px;
    text-align: center;
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .drop:hover, .drop.over { background: #e3f2f6; border-color: var(--sea); }
  .drop strong { display: block; color: var(--sea-deep); font-size: 16px; }
  .drop span { display: block; margin-top: 4px; font-size: 13px; color: var(--muted); }
  .drop input { display: none; }
  .status { min-height: 20px; font-size: 13px; color: var(--sea-deep); margin: -6px 0 10px; }
  .status.err { color: var(--danger); }

  ol.files { list-style: none; margin: 0; padding: 0; }
  ol.files li { display: flex; gap: 6px; align-items: stretch; }
  ol.files li + li { margin-top: 8px; }
  .file {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    text-align: left;
    background: #fbf9f4;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px;
    font: inherit;
    color: inherit;
    cursor: pointer;
  }
  .file:hover { border-color: var(--sea); }
  .file.active { background: #e6f3f7; border-color: var(--sea); }
  .num {
    flex: none;
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--sea);
    color: #fff;
    display: grid;
    place-items: center;
    font-size: 14px;
    font-weight: 700;
  }
  .meta { min-width: 0; }
  .fname { display: block; font-weight: 500; word-break: break-all; }
  .fdate { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .del {
    flex: none;
    width: 40px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #fff;
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
  }
  .del:hover { color: var(--danger); border-color: var(--danger); }
  .empty {
    padding: 40px 16px;
    text-align: center;
    color: var(--muted);
    line-height: 1.7;
  }

  .viewer { padding: 0; overflow: hidden; }
  .viewer-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
  }
  .viewer-title { font-weight: 700; word-break: break-all; }
  .open-link {
    color: var(--sea);
    font-size: 14px;
    font-weight: 700;
    text-decoration: none;
    white-space: nowrap;
  }
  iframe {
    display: block;
    width: 100%;
    height: 78vh;
    border: 0;
    background: #eee;
  }

  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    .viewer { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <span class="eyebrow">수학여행</span>
    <h1>제주 수학여행 자료실</h1>
    <p>일정표, 안내문, 활동지 등 수학여행 자료를 올리고 바로 볼 수 있어요.</p>
  </div>
</header>

<main>
  <div class="wrap layout">
    <section class="panel">
      <h2>자료 목록<span class="count" id="count"></span></h2>

      <label class="drop" id="drop">
        <input type="file" id="picker" accept="application/pdf,.pdf" multiple>
        <strong>＋ PDF 자료 올리기</strong>
        <span>여기를 누르거나 파일을 끌어다 놓으세요 (여러 개 가능)</span>
      </label>
      <div class="status" id="status"></div>

      <ol class="files" id="list"></ol>
    </section>

    <section class="panel viewer">
      <div class="viewer-bar">
        <span class="viewer-title" id="vtitle">자료를 선택하세요</span>
        <a class="open-link" id="vopen" target="_blank" rel="noopener" hidden>새 창에서 열기 ↗</a>
      </div>
      <div id="vbody" class="empty">왼쪽 목록에서 자료를 누르면<br>여기에서 바로 볼 수 있어요.</div>
    </section>
  </div>
</main>

<script>
  /* ---------- 저장소 (브라우저 IndexedDB) ---------- */
  const DB_NAME = "jeju-trip-files";
  const STORE = "files";
  let memory = [];          // IndexedDB를 못 쓸 때 임시 저장
  let dbPromise = null;

  function openDB() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      try {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => {
          req.result.createObjectStore(STORE, { keyPath: "id", autoIncrement: true });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      } catch (e) { reject(e); }
    });
    return dbPromise;
  }

  async function getAll() {
    try {
      const db = await openDB();
      return await new Promise((res, rej) => {
        const r = db.transaction(STORE).objectStore(STORE).getAll();
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
    } catch (e) { return memory.slice(); }
  }

  async function add(record) {
    try {
      const db = await openDB();
      await new Promise((res, rej) => {
        const tx = db.transaction(STORE, "readwrite");
        tx.objectStore(STORE).add(record);
        tx.oncomplete = res;
        tx.onerror = () => rej(tx.error);
      });
    } catch (e) {
      record.id = Date.now() + Math.random();
      memory.push(record);
    }
  }

  async function remove(id) {
    try {
      const db = await openDB();
      await new Promise((res, rej) => {
        const tx = db.transaction(STORE, "readwrite");
        tx.objectStore(STORE).delete(id);
        tx.oncomplete = res;
        tx.onerror = () => rej(tx.error);
      });
    } catch (e) {
      memory = memory.filter((f) => f.id !== id);
    }
  }

  /* ---------- 화면 ---------- */
  const list = document.getElementById("list");
  const countEl = document.getElementById("count");
  const statusEl = document.getElementById("status");
  const drop = document.getElementById("drop");
  const picker = document.getElementById("picker");
  const vtitle = document.getElementById("vtitle");
  const vopen = document.getElementById("vopen");
  const vbody = document.getElementById("vbody");

  let currentUrl = null;
  let activeId = null;

  const displayName = (n) => n.replace(/\.pdf$/i, "");
  const fmtDate = (t) => new Date(t).toLocaleString("ko-KR", {
    month: "long", day: "numeric", hour: "2-digit", minute: "2-digit"
  });

  function setStatus(msg, isErr) {
    statusEl.textContent = msg || "";
    statusEl.classList.toggle("err", !!isErr);
  }

  function resetViewer() {
    if (currentUrl) URL.revokeObjectURL(currentUrl);
    currentUrl = null;
    activeId = null;
    vtitle.textContent = "자료를 선택하세요";
    vopen.hidden = true;
    vbody.className = "empty";
    vbody.innerHTML = "왼쪽 목록에서 자료를 누르면<br>여기에서 바로 볼 수 있어요.";
  }

  const inlineViewer = () =>
    !window.matchMedia("(max-width: 760px)").matches &&
    navigator.pdfViewerEnabled !== false;

  function show(file, btn) {
    const blob = file.blob instanceof Blob ? file.blob : new Blob([file.blob], { type: "application/pdf" });
    if (currentUrl) URL.revokeObjectURL(currentUrl);
    currentUrl = URL.createObjectURL(blob);

    if (!inlineViewer()) {
      window.open(currentUrl, "_blank");
      return;
    }
    activeId = file.id;
    document.querySelectorAll(".file.active").forEach((el) => el.classList.remove("active"));
    btn.classList.add("active");
    vtitle.textContent = displayName(file.name);
    vopen.href = currentUrl;
    vopen.hidden = false;
    vbody.className = "";
    vbody.innerHTML = "";
    const frame = document.createElement("iframe");
    frame.src = currentUrl;
    frame.title = displayName(file.name);
    vbody.appendChild(frame);
  }

  async function render() {
    const files = (await getAll()).sort((a, b) => a.addedAt - b.addedAt); // 올린 순서대로
    countEl.textContent = files.length ? `${files.length}개` : "";
    list.innerHTML = "";

    if (!files.length) {
      list.innerHTML = '<li class="empty">아직 올라온 자료가 없어요.<br>위에서 PDF를 올려 보세요.</li>';
      return;
    }

    files.forEach((f, i) => {
      const li = document.createElement("li");

      const btn = document.createElement("button");
      btn.className = "file" + (f.id === activeId ? " active" : "");
      btn.innerHTML = `<span class="num">${i + 1}</span>
        <span class="meta"><span class="fname"></span><span class="fdate"></span></span>`;
      btn.querySelector(".fname").textContent = displayName(f.name);
      btn.querySelector(".fdate").textContent = fmtDate(f.addedAt) + " 업로드";
      btn.addEventListener("click", () => show(f, btn));

      const del = document.createElement("button");
      del.className = "del";
      del.title = "삭제";
      del.setAttribute("aria-label", displayName(f.name) + " 삭제");
      del.textContent = "×";
      del.addEventListener("click", async () => {
        if (!confirm(`'${displayName(f.name)}' 자료를 삭제할까요?`)) return;
        await remove(f.id);
        if (f.id === activeId) resetViewer();
        render();
      });

      li.append(btn, del);
      list.appendChild(li);
    });
  }

  async function handleFiles(fileList) {
    const all = Array.from(fileList);
    const pdfs = all.filter((f) => f.type === "application/pdf" || /\.pdf$/i.test(f.name));
    const skipped = all.length - pdfs.length;
    if (!pdfs.length) {
      setStatus("PDF 파일만 올릴 수 있어요.", true);
      return;
    }
    setStatus("올리는 중…");
    const base = Date.now();
    for (let i = 0; i < pdfs.length; i++) {
      const f = pdfs[i];
      await add({ name: f.name, size: f.size, addedAt: base + i, blob: f });
    }
    await render();
    setStatus(`${pdfs.length}개 자료를 올렸어요.` + (skipped ? ` (PDF가 아닌 파일 ${skipped}개는 제외)` : ""));
  }

  picker.addEventListener("change", () => {
    handleFiles(picker.files);
    picker.value = "";
  });
  ["dragenter", "dragover"].forEach((ev) =>
    drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); })
  );
  ["dragleave", "drop"].forEach((ev) =>
    drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); })
  );
  drop.addEventListener("drop", (e) => handleFiles(e.dataTransfer.files));

  render();
</script>
</body>
</html>
