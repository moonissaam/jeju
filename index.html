<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>함현고 제주 수학여행 자료실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --sea: #0e6e8c;
    --sea-deep: #0a4f66;
    --sand: #f6f1e7;
    --tangerine: #f08a24;
    --ink: #1f2a30;
    --muted: #61707a;
    --card: #ffffff;
    --line: #e4ddd0;
    --danger: #c0392b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Noto Sans KR", system-ui, sans-serif;
    color: var(--ink);
    background: var(--sand);
  }
  header {
    background: linear-gradient(160deg, var(--sea) 0%, var(--sea-deep) 100%);
    color: #fff;
    padding: 40px 20px 56px;
    position: relative;
    overflow: hidden;
  }
  header::after {
    content: "";
    position: absolute;
    left: -5%; right: -5%; bottom: -30px;
    height: 60px;
    background: var(--sand);
    border-radius: 50% 50% 0 0 / 100% 100% 0 0;
  }
  .wrap { max-width: 1200px; margin: 0 auto; }
  .eyebrow {
    display: inline-block;
    font-size: 13px;
    letter-spacing: .08em;
    background: var(--tangerine);
    padding: 4px 10px;
    border-radius: 999px;
    font-weight: 700;
  }
  h1 {
    font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
    font-size: clamp(28px, 5vw, 44px);
    margin: 14px 0 6px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  header p { margin: 0; opacity: .85; }

  .tabs-wrap {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--sand);
    padding: 6px 16px 10px;
  }
  .tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: none;
    font: inherit;
    font-size: 15px;
    font-weight: 700;
    padding: 9px 16px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    cursor: pointer;
  }
  .tab:hover { border-color: var(--sea); color: var(--sea); }
  .tab.common { border-color: var(--tangerine); color: #b5600f; }
  .tab[aria-selected="true"] { background: var(--sea); border-color: var(--sea); color: #fff; }
  .tab.common[aria-selected="true"] { background: var(--tangerine); border-color: var(--tangerine); color: #fff; }

  main { padding: 8px 16px 48px; }
  .layout {
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 20px;
    align-items: start;
  }
  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px;
  }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .panel h2 { font-size: 18px; margin: 0; }
  .count { color: var(--muted); font-size: 14px; margin-left: 6px; font-weight: 400; }
  .refresh {
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 8px;
    padding: 4px 10px;
    font: inherit;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
  }
  .refresh:hover { color: var(--sea); border-color: var(--sea); }

  .drop {
    display: block;
    margin: 14px 0 16px;
    border: 2px dashed #b9cfd6;
    border-radius: 14px;
    background: #f3f9fb;
    padding: 22px 14px;
    text-align: center;
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .drop:hover, .drop.over { background: #e3f2f6; border-color: var(--sea); }
  .drop.busy { opacity: .6; pointer-events: none; }
  .drop strong { display: block; color: var(--sea-deep); font-size: 16px; }
  .drop span { display: block; margin-top: 4px; font-size: 13px; color: var(--muted); }
  .drop input { display: none; }
  .status { min-height: 20px; font-size: 13px; color: var(--sea-deep); margin: -6px 0 10px; }
  .status.err { color: var(--danger); }

  ol.files { list-style: none; margin: 0; padding: 0; }
  ol.files li { display: flex; gap: 6px; align-items: stretch; }
  ol.files li + li { margin-top: 8px; }
  .file {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    text-align: left;
    background: #fbf9f4;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px;
    font: inherit;
    color: inherit;
    cursor: pointer;
  }
  .file:hover { border-color: var(--sea); }
  .file.active { background: #e6f3f7; border-color: var(--sea); }
  .num {
    flex: none;
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--sea);
    color: #fff;
    display: grid;
    place-items: center;
    font-size: 14px;
    font-weight: 700;
  }
  .meta { min-width: 0; }
  .fname { display: block; font-weight: 500; word-break: break-all; }
  .fdate { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .del {
    flex: none;
    width: 40px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #fff;
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
  }
  .del:hover { color: var(--danger); border-color: var(--danger); }
  .empty {
    padding: 40px 16px;
    text-align: center;
    color: var(--muted);
    line-height: 1.7;
  }

  .viewer { padding: 0; overflow: hidden; }
  .viewer-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
  }
  .viewer-title { font-weight: 700; word-break: break-all; }
  .open-link {
    color: var(--sea);
    font-size: 14px;
    font-weight: 700;
    text-decoration: none;
    white-space: nowrap;
  }
  .viewer-actions { display: flex; align-items: center; gap: 12px; flex: none; }
  .close-btn {
    display: none;
    border: 0;
    background: var(--sea);
    color: #fff;
    font: inherit;
    font-weight: 700;
    font-size: 14px;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
  }
  #vbody.frame {
    position: relative;
    height: 78vh;
    background: #f3f0ea;
  }
  #vbody.frame .frame-loading {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: var(--muted);
    font-size: 14px;
  }
  #vbody.frame iframe {
    position: relative;
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
  }
  .loading { padding: 60px 16px; text-align: center; color: var(--muted); }

  .modal-bg {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(15, 30, 38, .45);
    display: grid;
    place-items: center;
    padding: 16px;
  }
  .modal-bg[hidden] { display: none; }
  .modal {
    width: min(360px, 100%);
    background: #fff;
    border-radius: 16px;
    padding: 22px 20px 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,.2);
  }
  .modal h3 { margin: 0 0 6px; font-size: 18px; }
  .modal p { margin: 0 0 14px; font-size: 14px; color: var(--muted); word-break: break-all; }
  .modal input {
    width: 100%;
    font: inherit;
    font-size: 16px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .modal input:focus { outline: 2px solid var(--sea); border-color: transparent; }
  .modal .err { min-height: 20px; margin: 6px 0 0; font-size: 13px; color: var(--danger); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
  .modal-actions button {
    font: inherit;
    font-weight: 700;
    font-size: 14px;
    padding: 9px 16px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: #fff;
    cursor: pointer;
  }
  .modal-actions .danger { background: var(--danger); border-color: var(--danger); color: #fff; }

  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    .viewer { display: none; }
    .viewer.open {
      display: flex;
      flex-direction: column;
      position: fixed;
      inset: 0;
      z-index: 50;
      border-radius: 0;
      border: 0;
    }
    .viewer.open #vbody.frame { flex: 1; height: auto; }
    .viewer.open .close-btn { display: inline-block; }
    body.viewing { overflow: hidden; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <span class="eyebrow">함현고 수학여행</span>
    <h1>함현고 제주 수학여행 자료실</h1>
    <p>일정표, 안내문, 활동지 등 수학여행 자료를 올리고 함께 볼 수 있어요.</p>
  </div>
</header>

<nav class="tabs-wrap" aria-label="반 선택">
  <div class="wrap tabs" id="tabs" role="tablist"></div>
</nav>

<main>
  <div class="wrap layout">
    <section class="panel">
      <div class="panel-head">
        <h2><span id="listTitle">공통 자료</span><span class="count" id="count"></span></h2>
        <button class="refresh" id="refresh" type="button">↻ 새로고침</button>
      </div>

      <label class="drop" id="drop">
        <input type="file" id="picker" accept="application/pdf,.pdf" multiple>
        <strong>＋ <em id="dropTarget" style="font-style:normal">공통 자료</em>에 PDF 올리기</strong>
        <span>여기를 누르거나 파일을 끌어다 놓으세요 (여러 개 가능, 한 파일 30MB까지)</span>
      </label>
      <div class="status" id="status"></div>

      <ol class="files" id="list"></ol>
    </section>

    <section class="panel viewer" id="viewer">
      <div class="viewer-bar">
        <span class="viewer-title" id="vtitle">자료를 선택하세요</span>
        <span class="viewer-actions">
          <a class="open-link" id="vopen" target="_blank" rel="noopener" hidden>원본 파일 ↗</a>
          <button class="close-btn" id="vclose" type="button">닫기</button>
        </span>
      </div>
      <div id="vbody" class="empty">왼쪽 목록에서 자료를 누르면<br>여기에서 바로 볼 수 있어요.</div>
    </section>
  </div>
</main>

<div class="modal-bg" id="delModal" hidden>
  <form class="modal" id="delForm">
    <h3>자료 삭제</h3>
    <p id="delName"></p>
    <input type="password" id="delPw" inputmode="numeric" autocomplete="off" placeholder="삭제 비밀번호">
    <div class="err" id="delErr"></div>
    <div class="modal-actions">
      <button type="button" id="delCancel">취소</button>
      <button type="submit" class="danger">삭제</button>
    </div>
  </form>
</div>

<script>
  /* ============================================================
     ▼ 구글 Apps Script 웹 앱 주소 — 이 한 줄만 바꿔 주세요
       (https://script.google.com/macros/s/……/exec 형태)
     ============================================================ */
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxtDDbw5fdbJKaQa2_Jfr4kyWR2Bw_p9sxX9l-2MGL9DtZGJULCJ9yHXZoiG3B60Ecjcw/exec";
  /* ============================================================ */

  const MAX_MB = 30;

  const list = document.getElementById("list");
  const countEl = document.getElementById("count");
  const statusEl = document.getElementById("status");
  const drop = document.getElementById("drop");
  const picker = document.getElementById("picker");
  const vtitle = document.getElementById("vtitle");
  const vopen = document.getElementById("vopen");
  const vbody = document.getElementById("vbody");
  const viewerEl = document.getElementById("viewer");
  const vclose = document.getElementById("vclose");

  const scriptUrl = SCRIPT_URL.trim();
  const configured = /^https:\/\/script\.google(usercontent)?\.com\/.+/.test(scriptUrl);

  /* ---------- 서버(Apps Script) 호출 ---------- */
  async function apiGet(params) {
    const res = await fetch(scriptUrl + "?" + new URLSearchParams(params));
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || "알 수 없는 오류");
    return json;
  }
  async function apiPost(body) {
    // Content-Type을 지정하지 않아야 구글 서버와 바로 통신돼요
    const res = await fetch(scriptUrl, { method: "POST", body: JSON.stringify(body) });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || "알 수 없는 오류");
    return json;
  }

  /* ---------- 공통 ---------- */
  const displayName = (n) => n.replace(/\.pdf$/i, "");
  const fmtDate = (t) => new Date(t).toLocaleString("ko-KR", {
    month: "long", day: "numeric", hour: "2-digit", minute: "2-digit"
  });
  const fmtSize = (b) => b >= 1048576 ? (b / 1048576).toFixed(1) + "MB" : Math.max(1, Math.round(b / 1024)) + "KB";

  function setStatus(msg, isErr) {
    statusEl.textContent = msg || "";
    statusEl.classList.toggle("err", !!isErr);
  }

  /* ---------- 미리보기 (구글 드라이브 뷰어) ---------- */
  let activeId = null;
  const isMobile = () => window.matchMedia("(max-width: 760px)").matches;

  function resetViewer() {
    activeId = null;
    vtitle.textContent = "자료를 선택하세요";
    vopen.hidden = true;
    vbody.className = "empty";
    vbody.innerHTML = "왼쪽 목록에서 자료를 누르면<br>여기에서 바로 볼 수 있어요.";
  }

  function openMobileViewer() {
    if (!isMobile() || viewerEl.classList.contains("open")) return;
    viewerEl.classList.add("open");
    document.body.classList.add("viewing");
    try { history.pushState({ viewer: true }, ""); } catch (e) {}
  }
  function closeMobileViewer(fromHistory) {
    if (!viewerEl.classList.contains("open")) return;
    viewerEl.classList.remove("open");
    document.body.classList.remove("viewing");
    vbody.innerHTML = "";
    activeId = null;
    if (!fromHistory) { try { history.back(); } catch (e) {} }
  }
  vclose.addEventListener("click", () => closeMobileViewer(false));
  window.addEventListener("popstate", () => closeMobileViewer(true)); // 휴대폰 뒤로가기 = 닫기

  function show(file, btn) {
    activeId = file.id;
    document.querySelectorAll(".file.active").forEach((el) => el.classList.remove("active"));
    btn.classList.add("active");
    vtitle.textContent = displayName(file.name);
    vopen.href = `https://drive.google.com/file/d/${encodeURIComponent(file.id)}/view`;
    vopen.hidden = false;
    openMobileViewer();
    vbody.className = "frame";
    vbody.innerHTML = '<div class="frame-loading">자료를 여는 중…</div>';
    const frame = document.createElement("iframe");
    frame.src = `https://drive.google.com/file/d/${encodeURIComponent(file.id)}/preview`;
    frame.title = displayName(file.name);
    frame.allow = "autoplay";
    vbody.appendChild(frame);
  }

  /* ---------- 비밀번호 확인 후 삭제 (비밀번호는 구글 서버에서 확인) ---------- */
  const delModal = document.getElementById("delModal");
  const delForm = document.getElementById("delForm");
  const delName = document.getElementById("delName");
  const delPw = document.getElementById("delPw");
  const delErr = document.getElementById("delErr");
  const delSubmit = delForm.querySelector(".danger");
  let pendingDelete = null;

  function askDelete(file) {
    pendingDelete = file;
    delName.textContent = `'${displayName(file.name)}' 자료를 삭제하려면 비밀번호를 입력하세요. 삭제하면 모든 사람의 화면에서 사라져요.`;
    delPw.value = "";
    delErr.textContent = "";
    delSubmit.disabled = false;
    delModal.hidden = false;
    setTimeout(() => delPw.focus(), 50);
  }
  function closeDelete() {
    delModal.hidden = true;
    pendingDelete = null;
  }
  document.getElementById("delCancel").addEventListener("click", closeDelete);
  delModal.addEventListener("click", (e) => { if (e.target === delModal) closeDelete(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !delModal.hidden) closeDelete(); });

  delForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = pendingDelete;
    if (!f || delSubmit.disabled) return;
    delSubmit.disabled = true;
    delErr.textContent = "확인하는 중…";
    try {
      await apiPost({ action: "delete", id: f.id, password: delPw.value.trim() });
    } catch (err) {
      delErr.textContent = err.message;
      delSubmit.disabled = false;
      delPw.select();
      return;
    }
    closeDelete();
    if (f.id === activeId) resetViewer();
    setStatus("삭제했어요.");
    render();
  });

  /* ---------- 공통 / 1반~10반 탭 ---------- */
  const CLASS_COUNT = 10;
  const SECTIONS = [{ id: "common", label: "공통 자료" }];
  for (let n = 1; n <= CLASS_COUNT; n++) SECTIONS.push({ id: "class" + n, label: n + "반" });

  const tabsEl = document.getElementById("tabs");
  const listTitle = document.getElementById("listTitle");
  let current = SECTIONS[0];
  let listToken = 0;

  SECTIONS.forEach((sec) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "tab" + (sec.id === "common" ? " common" : "");
    b.textContent = sec.id === "common" ? "공통" : sec.label;
    b.dataset.id = sec.id;
    b.setAttribute("role", "tab");
    b.addEventListener("click", () => { location.hash = sec.id; });
    tabsEl.appendChild(b);
  });

  function selectFromHash() {
    const id = decodeURIComponent(location.hash.slice(1));
    current = SECTIONS.find((sec) => sec.id === id) || SECTIONS[0];
    tabsEl.querySelectorAll(".tab").forEach((b) => {
      const on = b.dataset.id === current.id;
      b.setAttribute("aria-selected", on ? "true" : "false");
      if (on) b.scrollIntoView({ block: "nearest", inline: "nearest" });
    });
    const isCommon = current.id === "common";
    listTitle.textContent = isCommon ? "공통 자료" : current.label + " 자료";
    document.getElementById("dropTarget").textContent = isCommon ? "공통 자료" : current.label;
    document.title = (isCommon ? "" : current.label + " · ") + "함현고 제주 수학여행 자료실";
    countEl.textContent = "";
    list.innerHTML = '<li class="empty">불러오는 중…</li>';
    setStatus("");
    if (viewerEl.classList.contains("open")) closeMobileViewer(true);
    resetViewer();
    render();
  }
  window.addEventListener("hashchange", selectFromHash);

  /* ---------- 목록 ---------- */
  async function render() {
    if (!configured) {
      list.innerHTML = '<li class="empty">아직 구글 드라이브가 연결되지 않았어요.<br>index.html의 SCRIPT_URL에 웹 앱 주소를 넣어 주세요.</li>';
      drop.classList.add("busy");
      return;
    }

    const sec = current;
    const token = ++listToken;
    let files;
    try {
      files = (await apiGet({ action: "list", section: sec.id })).files;
    } catch (err) {
      if (token !== listToken) return;
      setStatus("목록을 불러오지 못했어요: " + err.message, true);
      if (!list.querySelector(".file")) list.innerHTML = '<li class="empty">목록을 불러오지 못했어요.<br>↻ 새로고침을 눌러 다시 시도해 보세요.</li>';
      return;
    }
    if (token !== listToken) return; // 그 사이 다른 반을 눌렀으면 무시

    countEl.textContent = files.length ? `${files.length}개` : "";
    list.innerHTML = "";

    if (!files.length) {
      list.innerHTML = `<li class="empty">아직 ${sec.id === "common" ? "공통" : sec.label} 자료가 없어요.<br>위에서 PDF를 올려 보세요.</li>`;
      return;
    }

    files.forEach((f, i) => {
      const li = document.createElement("li");

      const btn = document.createElement("button");
      btn.className = "file" + (f.id === activeId ? " active" : "");
      btn.innerHTML = `<span class="num">${i + 1}</span>
        <span class="meta"><span class="fname"></span><span class="fdate"></span></span>`;
      btn.querySelector(".fname").textContent = displayName(f.name);
      btn.querySelector(".fdate").textContent = fmtDate(f.time) + " 업로드 · " + fmtSize(f.size);
      btn.addEventListener("click", () => show(f, btn));

      const del = document.createElement("button");
      del.className = "del";
      del.title = "삭제";
      del.setAttribute("aria-label", displayName(f.name) + " 삭제");
      del.textContent = "×";
      del.addEventListener("click", () => askDelete(f));

      li.append(btn, del);
      list.appendChild(li);
    });
  }

  /* ---------- 업로드 ---------- */
  function readBase64(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(String(r.result).split(",")[1] || "");
      r.onerror = () => reject(r.error);
      r.readAsDataURL(file);
    });
  }

  async function handleFiles(fileList) {
    if (!configured) return;
    const sec = current;
    const all = Array.from(fileList);
    const pdfs = all.filter((f) => f.type === "application/pdf" || /\.pdf$/i.test(f.name));
    const notPdf = all.length - pdfs.length;
    const tooBig = pdfs.filter((f) => f.size > MAX_MB * 1048576);
    const ok = pdfs.filter((f) => f.size <= MAX_MB * 1048576);

    if (!ok.length) {
      setStatus(tooBig.length
        ? `${MAX_MB}MB보다 큰 파일은 올릴 수 없어요. PDF를 압축해서 올려 주세요.`
        : "PDF 파일만 올릴 수 있어요.", true);
      return;
    }

    drop.classList.add("busy");
    let done = 0;
    const fails = [];
    for (let i = 0; i < ok.length; i++) {
      const f = ok[i];
      setStatus(`${sec.label}에 올리는 중… (${i + 1}/${ok.length}) ${f.name}`);
      try {
        const data = await readBase64(f);
        await apiPost({ action: "upload", section: sec.id, name: f.name, data });
        done++;
      } catch (err) {
        fails.push(`${f.name} (${err.message})`);
      }
    }
    drop.classList.remove("busy");
    if (sec === current) await render();

    let msg = `${sec.label}에 ${done}개 자료를 올렸어요.`;
    if (notPdf) msg += ` PDF가 아닌 파일 ${notPdf}개는 제외했어요.`;
    if (tooBig.length) msg += ` ${MAX_MB}MB가 넘는 파일 ${tooBig.length}개는 압축 후 올려 주세요.`;
    if (fails.length) msg += ` 실패: ${fails.join(", ")}`;
    setStatus(msg, fails.length > 0 || tooBig.length > 0);
  }

  picker.addEventListener("change", () => { handleFiles(picker.files); picker.value = ""; });
  ["dragenter", "dragover"].forEach((ev) =>
    drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); })
  );
  ["dragleave", "drop"].forEach((ev) =>
    drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); })
  );
  drop.addEventListener("drop", (e) => handleFiles(e.dataTransfer.files));
  document.getElementById("refresh").addEventListener("click", () => { setStatus(""); render(); });

  // 다른 사람이 올린 자료도 반영 (1분마다, 화면을 보고 있을 때만 / 창으로 돌아올 때)
  setInterval(() => { if (!document.hidden) render(); }, 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });

  selectFromHash();
</script>
</body>
</html>
